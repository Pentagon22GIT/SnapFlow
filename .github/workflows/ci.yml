name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check shell syntax
        run: zsh -n Scripts/*.sh

      - name: Run tests
        run: swift test

      - name: Build Community edition
        run: ./Scripts/build-community.sh

      - name: Verify Community identity
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'build/community/SnapFlow Community.app/Contents/Info.plist')" = "dev.pent.SnapFlow.community"
          codesign --verify --strict --verbose=2 'build/community/SnapFlow Community.app'
